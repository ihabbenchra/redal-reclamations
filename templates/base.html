<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redal - Gestion des réclamations</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
input[type=text], input[type=password], input[type=email], textarea, select {
  width: 100%;
  padding: 0.375rem 0.75rem;
  border: 1px solid #ced4da;
  border-radius: 0.375rem;
}
</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="{% url 'accueil' %}">Redal Réclamations</a>
    <div class="d-flex">
      {% if user.is_authenticated %}
        <span class="navbar-text text-white me-3">{{ user.username }} ({{ user.get_role_display }})</span>
        <form method="post" action="{% url 'deconnexion' %}">
          {% csrf_token %}
          <button class="btn btn-outline-light btn-sm" type="submit">Déconnexion</button>
        </form>
      {% else %}
        <a class="btn btn-outline-light btn-sm me-2" href="{% url 'connexion' %}">Connexion</a>
        <a class="btn btn-light btn-sm" href="{% url 'inscription' %}">Inscription</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container mt-4">
  {% for message in messages %}
    <div class="alert alert-info">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
