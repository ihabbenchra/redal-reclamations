{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">Déposer une réclamation</h2>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Titre</label>
        {{ form.titre }}
      </div>
      <div class="mb-3">
        <label class="form-label">Description</label>
        {{ form.description }}
      </div>
      <div class="form-check mb-3">
        {{ form.anonyme }}
        <label class="form-check-label">Déposer anonymement</label>
      </div>
      <button type="submit" class="btn btn-primary">Envoyer</button>
    </form>
  </div>
</div>
{% endblock %}
